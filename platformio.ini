; EspRangeTest - PlatformIO config.
;
; framework = espidf, not arduino: the S=8 work needs NimBLE extended advertising and, very
; likely, a raw HCI command to reach the advertising PHY-options field. Those are awkward or
; unavailable through the Arduino layer.
;
; The much-repeated "PlatformIO does not support the ESP32-C6" is about the *Arduino*
; framework specifically. Both C6 devkits have official board definitions and both list
; espidf as supported, so the official platform is used here. If it ever does fight us, the
; pioarduino fork is the escape hatch - see the commented platform line below.
;
; Usage:
;   pio run -e devkitc -t upload -t monitor     build, flash, watch the report
;   pio run -e devkitm -t upload                the other board
;   pio run -t clean
;
; With both boards plugged in, name the port explicitly rather than trusting autodetect:
;   pio run -e devkitc -t upload --upload-port COM23

[platformio]
; PlatformIO defaults its sources to src/; ESP-IDF uses main/. Pointing PIO at the IDF
; layout means one source tree serves both toolchains - no duplication, no symlinks.
src_dir = main
default_envs = devkitc

; Ports are set per-environment below (COM23 / COM25). If they ever move, override them in a
; git-ignored ports.local.ini rather than editing this file, so a reset to origin does not
; wipe the change:
;
;   [env:devkitm]
;   upload_port = COM7
;
; The glob matches nothing when no such file exists, which is fine.
extra_configs = *.local.ini

[env]
platform = espressif32
; Fallback if the official platform stops recognising the C6. Pin <TAG> from
; https://github.com/pioarduino/platform-espressif32/releases
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/<TAG>/platform-espressif32.zip
framework = espidf

; Bring-up ladder - see the comment in main/rt.h.
;   0 heartbeat only   1 +wifi/esp-now   2 +ble   3 +802.15.4   4 +phone UI
; Raise one step at a time, flashing after each. Start at 0 on a board that will not boot:
; if even 0 fails, the problem is build config, not radio code.
build_flags = -DRT_STAGE=4

; Must be set here, not via CONFIG_PARTITION_TABLE_* in sdkconfig.defaults: PlatformIO takes
; the partition table from the board manifest and ignores those options. Left to the default
; the app gets 1MB, and this image is ~1.15MB - which fails at boot, not at build time.
board_build.partitions = partitions.csv

; Console is USB Serial/JTAG (see sdkconfig.defaults), so this baud is nominal - USB CDC
; ignores it - but PlatformIO still wants a value.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; upload_port / monitor_port are deliberately unset. Autodetect handles one board; with two
; attached, pass --upload-port. Hardcoded COM numbers move between reboots and differ per
; machine, which wastes more time than it saves.

; Flash size is 4MB on BOTH environments on purpose, even though the WROOM-1 has 8MB. It has
; to match CONFIG_ESPTOOLPY_FLASHSIZE in sdkconfig.defaults, because the C6 derives its flash
; MMU page size from it and the bootloader rejects an app whose header disagrees
; ("Invalid app image header"). partitions.csv needs only 3.06MB, so nothing is lost.

[env:devkitc]
; ESP32-C6-DevKitC-1, WROOM-1 module, PCB antenna.
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_port = COM26
monitor_port = COM26

[env:devkitm]
; ESP32-C6-DevKitM-1, MINI-1 module, different antenna design.
; The antenna difference between these two boards is itself one of the things being measured,
; so both get first-class build environments rather than one being an afterthought.
board = esp32-c6-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_port = COM25
monitor_port = COM25
