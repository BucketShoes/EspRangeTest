; PlatformIO project config for the ESP Range Test rig.
; Two environments, one per physical board - same firmware, different port/board def.
; Board and port assignment (confirmed by the user):
;   COM23 = ESP32-C6-DevKitC-1  (WROOM-1 module, 8MB flash)
;   COM24 = ESP32-C6-DevKitM-1  (MINI-1 module, 4MB flash)
;
; Usage:
;   pio run -e devkitc_com23 -t upload      (flash the DevKitC on COM23)
;   pio run -e devkitm_com24 -t upload      (flash the DevKitM on COM24)
;   pio run -t upload                       (builds+uploads both envs, one after another)
;   pio device monitor -e devkitc_com23     (serial monitor, debug only - never load-bearing for results)

[platformio]
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
; Reuse the NimBLE-Arduino copy already installed for the Arduino IDE instead of
; PlatformIO fetching its own separate copy.
lib_extra_dirs = C:/Users/Kaldosh/Documents/Arduino/libraries
; Default 4MB partition table only gives ~1.3MB per app slot (this firmware already
; fills it to 99.9%). huge_app.csv gives a single ~3MB app partition with no OTA
; slot duplication - fits both the 4MB DevKitM and the 8MB DevKitC, no filesystem
; needed since this firmware doesn't use one.
board_build.partitions = huge_app.csv

[env:devkitc_com23]
board = esp32-c6-devkitc-1
upload_port = COM23
monitor_port = COM23

[env:devkitm_com24]
board = esp32-c6-devkitm-1
upload_port = COM24
monitor_port = COM24
